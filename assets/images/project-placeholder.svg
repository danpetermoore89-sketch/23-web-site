<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Project image placeholder</title>
  <desc id="desc">A neutral branded placeholder to replace with real project imagery.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#61ebb6"/>
      <stop offset="1" stop-color="#dd75e7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#f7f5f7"/>
  <circle cx="225" cy="700" r="260" fill="url(#brand)"/>
  <rect x="510" y="170" width="500" height="560" rx="28" fill="#ffffff" stroke="#d6d5d7" stroke-width="8"/>
  <rect x="570" y="250" width="270" height="24" rx="12" fill="#09080a"/>
  <rect x="570" y="310" width="360" height="16" rx="8" fill="#d6d5d7"/>
  <rect x="570" y="350" width="310" height="16" rx="8" fill="#d6d5d7"/>
  <rect x="570" y="430" width="380" height="210" rx="16" fill="#09080a"/>
</svg>
